name: obsbot_protocol
description: >
  Shared Dart types for the WebSocket protocol between Open OBSBOT
  Remote clients and the Open OBSBOT Bridge. Pure-Dart, no Flutter
  dependency, so it can be used from any client (mobile, web, desktop)
  or from a Dart-based bridge UI.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  meta: ^1.15.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
