name: obsbot_api_client
description: >
  WebSocket transport for the Open OBSBOT Bridge protocol. Moves JSON
  frames and correlates request ids to acks. Knows nothing about cameras.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
