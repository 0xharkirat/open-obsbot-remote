name: auth_repository
description: >
  PIN-pairing and per-bridge token auth for the Open OBSBOT Remote. Sits on
  top of obsbot_api_client, exposes an AuthStatus stream, and keeps the
  bridge's developer-facing protocol hints out of user copy (CLAUDE.md #41).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  obsbot_api_client:
    path: ../obsbot_api_client

dev_dependencies:
  lints: ^5.1.0
  mocktail: ^1.0.4
  test: ^1.25.0
