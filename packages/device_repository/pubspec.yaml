name: device_repository
description: >
  Per-camera command + optimistic-state layer for Open OBSBOT Remote.
  Every action is addressed by device_id and injected onto the wire.
  Merges the bridge's real state events with short-lived local overlays
  so toggles and sliders react on the tap-frame while the camera's
  eventual (possibly clamped) value still wins.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  bridge_repository:
    path: ../bridge_repository
  obsbot_api_client:
    path: ../obsbot_api_client
  obsbot_protocol:
    path: ../obsbot_protocol

dev_dependencies:
  lints: ^5.1.0
  mocktail: ^1.0.4
  test: ^1.25.0
