name: bridge_repository
description: >
  Bridge-scoped state and device-management layer for Open OBSBOT Remote.
  Turns the raw JSON frames from obsbot_api_client into a replayed
  BridgeState stream and exposes device.list / set_active / rename plus
  the MJPEG preview URL builder. Knows about the whole bridge and its
  device set, but not about driving a single gimbal.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  meta: ^1.15.0
  obsbot_api_client:
    path: ../obsbot_api_client
  obsbot_protocol:
    path: ../obsbot_protocol

dev_dependencies:
  lints: ^5.1.0
  mocktail: ^1.0.4
  test: ^1.25.0
