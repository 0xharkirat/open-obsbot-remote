name: Feature request
description: Suggest a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: Describe the situation that prompted the request, not just the proposed solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you think a good fix or feature looks like. UI sketch / protocol delta / API name.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Why this approach over the alternatives?

  - type: input
    id: scope
    attributes:
      label: Surface impacted
      placeholder: "Bridge / RC native / RC web / Sequencer / Auth / Build"

  - type: dropdown
    id: priority
    attributes:
      label: How urgent is this for you?
      options:
        - "Blocking my use of the project"
        - "Big improvement, would use immediately"
        - "Nice to have"
